services:
  devcontainer:
    init: true
    command: sleep infinity
    depends_on:
      floci:
        condition: service_healthy
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TZ: "${TZ:-Asia/Tokyo}"
        IMAGEARCH: ${IMAGEARCH:-arm64v8/}
        GIT_DELTA_VERSION: "0.18.2"
        ZSH_IN_DOCKER_VERSION: "1.2.0"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - seccomp=./seccomp.json
    volumes:
      - claude-code-bashhistory:/commandhistory
      - claude-code-config:/home/node/.claude
      - codex-config:/home/node/.codex
      - codex-agents:/home/node/.agents
      - ${LOCAL_WORKSPACE_FOLDER:-.}/..:/workspace
    environment:
      CLAUDE_CONFIG_DIR: /home/node/.claude
      POWERLEVEL9K_DISABLE_GITSTATUS: "true"
      GH_TOKEN: ${GH_TOKEN}
      GIT_USER_NAME: ${GIT_USER_NAME:-}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-}
      CONTEXT7_API_KEY: ${CONTEXT7_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://proxy.bar504.net}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FLOCI_ENDPOINT_URL: http://floci:4566

  floci:
    image: floci-local:2.2.0-refresh.2-native
    build:
      context: ./floci
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:24566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./floci/local-jwt-command.sh:/usr/local/bin/local-jwt-command.sh:ro
    tmpfs:
      - /app/data
    environment:
      FLOCI_SECURITY_ALLOW_PRIVATE_JWT_TARGETS: "true"
      FLOCI_STORAGE_MODE: memory
    command: ["bash", "/usr/local/bin/local-jwt-command.sh"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  claude-code-bashhistory:
  claude-code-config:
  codex-config:
  codex-agents:
